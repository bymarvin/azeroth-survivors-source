[package]
name = "coop-update"
version = "0.0.12"
edition = "2021"
description = "Azeroth Survivors Together co-op updater (one file)"

[[bin]]
name = "coop-update"
path = "src/main.rs"

# Online self-updating updater (release asset Azeroth-Survivors-Together-Updater.exe).
[[bin]]
name = "coop-updater"
path = "src/online.rs"

# Repair of a folder without the co-op Python runtime (src/repair.rs): signed release description and runtime
# archive, same crates and versions as the installer (coop-lab/installer).
[dependencies]
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
sha2 = "0.10"
serde_json = "1"
base64 = "0.22"
miniz_oxide = "0.8"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
# Debug information goes into a separate PDB next to the exe (crash analysis), never into the exe;
# build.rs links with /Brepro and /PDBALTPATH:%_PDB% (reproducible, no build path).
debug = "line-tables-only"
strip = "none"
panic = "abort"
