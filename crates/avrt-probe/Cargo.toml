[package]
name = "avrt-probe"
version = "0.1.0"
edition = "2021"
description = "Test program: calls the avrt.dll functions the game imports, through the normal import table"
license = "MIT"
publish = false

[[bin]]
name = "avrt-probe"
path = "src/main.rs"

[dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }
